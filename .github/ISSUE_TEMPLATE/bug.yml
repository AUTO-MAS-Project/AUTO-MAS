name: 缺陷报告
description: 报告 Bug（请按仓库协作规范填写）
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请用**简体中文**填写，由提交者本人撰写（勿依赖 AI 代写）。

        **背景**：实际现象、复现步骤、环境（版本、系统等）。  
        **期望**：正确或预期的行为。

        **请勿写**：实现方案、代码路径、验收 checkbox 清单。  
        理想篇幅约 150～400 字。详见 [.github/ISSUE_PR_GUIDE.md](../ISSUE_PR_GUIDE.md)。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 实际现象、复现步骤、环境（版本、系统等）
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望
      description: 正确或预期的行为
    validations:
      required: true
