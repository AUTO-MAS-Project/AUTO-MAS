name: "[bug] 缺陷报告"
description: 现象 · 版本 · 日志 · 备注
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 现象、复现步骤、期望行为
      placeholder: |
        现象：…
        步骤：1. … 2. …
        期望：…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AUTO-MAS 版本
      description: 应用「关于」中的版本号
      placeholder: v5.3.0-beta.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 选填，建议提供；提交后可补截图
      placeholder: 后端 / 前端控制台 / 脚本输出…
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 选填
      placeholder: 系统、脚本类型等…
