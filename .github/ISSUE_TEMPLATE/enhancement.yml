name: "[Enhancement] 功能建议"
description: 背景 · 期望 · 备注（选填）
title: "[Enhancement] "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么需要改
      placeholder: 当前情况与痛点…
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望
      description: 希望做到什么（可分点）
      placeholder: "- …"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 选填
      placeholder: 范围、相关 Issue 等…
