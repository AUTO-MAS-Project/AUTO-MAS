name: 功能建议
description: 新功能或改进（请按仓库协作规范填写）
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请用**简体中文**填写，由提交者本人撰写（勿依赖 AI 代写）。

        **背景**：现状与痛点，说明「为什么需要改」。  
        **期望**：要达成什么（多个功能请用小标题或编号分点）。

        **请勿写**：实现方案、API/Schema、代码路径、冗长验收清单。  
        理想篇幅约 150～400 字；多条独立需求请拆成多个 Issue。详见 [.github/ISSUE_PR_GUIDE.md](../ISSUE_PR_GUIDE.md)。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 现状与痛点，说明「为什么需要改」
      placeholder: 当前遇到什么问题？对用户/维护者有什么影响？
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望
      description: 要达成什么（可分点；多个功能请用小标题或编号）
      placeholder: |
        ### 1. 功能点标题
        - 用户可见的行为
    validations:
      required: true
