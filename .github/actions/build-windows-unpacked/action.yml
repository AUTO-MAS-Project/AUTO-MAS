name: 构建 Windows 解压包
description: 构建 Electron 应用，生成不含 Runtime 的未签名 win-unpacked 验证目录。

inputs:
  sentry-auth-token:
    description: 可选的 Sentry Auth Token；CI 构建留空。
    required: false
    default: ''
  sentry-org:
    description: 可选的 Sentry Organization；CI 构建留空。
    required: false
    default: ''
  sentry-project:
    description: 可选的 Sentry Project；CI 构建留空。
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: 设置 Node.js 环境
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.18.0'

    - name: 构建应用程序
      working-directory: frontend
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_ORG: ${{ inputs.sentry-org }}
        SENTRY_PROJECT: ${{ inputs.sentry-project }}
        GITHUB_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
        corepack enable
        corepack prepare yarn@4.18.1 --activate
        yarn install
        # CI 只验收未签名 win-unpacked；生产安装器仍由发布工作流构建。
        # 将前端与主进程编译各执行一次，只重试最后的 Electron 解压版打包。
        # --dir 不创建 NSIS 安装器，避免为未使用的 NSIS 工具下载再触发 504。
        yarn vp build
        if ($LASTEXITCODE -ne 0) { throw '前端打包失败' }
        yarn build:main
        if ($LASTEXITCODE -ne 0) { throw 'Electron 主进程编译失败' }
        # 官方 Electron 下载遇到暂时性故障时，从受校验的备用镜像获取同版归档。
        # electronDist 只在 CI 解压包使用，正式发行构建不更改下载源。
        $maxAttempts = 3
        $verifiedElectronDist = $null
        $PSNativeCommandUseErrorActionPreference = $false
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          $logPath = Join-Path $env:RUNNER_TEMP "electron-build-attempt-$attempt.log"
          $buildArgs = @('electron-builder', '--dir', '--publish', 'never')
          if ($verifiedElectronDist) {
            $buildArgs += "-c.electronDist=$verifiedElectronDist"
          }
          Write-Host "Electron 构建尝试 $attempt/$maxAttempts"
          yarn @buildArgs *>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            break
          }

          $electronDownloadFailed = Select-String -LiteralPath $logPath -Pattern 'cannot resolve https://github\.com/electron/electron/releases/download/[^/]+/electron-v[^/]+-win32-x64\.zip: status code (?:429|5\d\d)' -Quiet
          $codeSignDownloadFailed = Select-String -LiteralPath $logPath -Pattern 'cannot resolve https://github\.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-[^/]+/winCodeSign-[^/]+\.7z: status code (?:429|5\d\d)' -Quiet
          if ((-not $electronDownloadFailed -and -not $codeSignDownloadFailed) -or $attempt -eq $maxAttempts) {
            throw "Electron 构建失败（exit=$exitCode，尝试 $attempt/$maxAttempts）"
          }

          if ($electronDownloadFailed -and -not $verifiedElectronDist) {
            $verifiedElectronDist = Join-Path $env:RUNNER_TEMP 'verified-electron'
            & (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/prepare-ci-electron.ps1') -PackageJson (Join-Path (Get-Location).Path 'package.json') -OutputDirectory $verifiedElectronDist
          }
          $delaySeconds = 20 * $attempt
          Write-Warning "Electron GitHub 依赖下载暂时失败，$delaySeconds 秒后重试"
          Start-Sleep -Seconds $delaySeconds
        }
        if (-not (Test-Path -LiteralPath 'dist/win-unpacked/AUTO-MAS.exe' -PathType Leaf)) {
          throw 'Electron 构建未生成 AUTO-MAS.exe'
        }
