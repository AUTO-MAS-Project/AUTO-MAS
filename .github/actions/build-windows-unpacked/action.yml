name: 构建 Windows 解压包
description: 构建 Electron 应用，生成不含 Runtime 的未签名 win-unpacked 验证目录。

inputs:
  sentry-auth-token:
    description: 可选的 Sentry Auth Token；CI 构建留空。
    required: false
    default: ''
  sentry-org:
    description: 可选的 Sentry Organization；CI 构建留空。
    required: false
    default: ''
  sentry-project:
    description: 可选的 Sentry Project；CI 构建留空。
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: 设置 Node.js 环境
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.18.0'

    - name: 构建应用程序
      working-directory: frontend
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_ORG: ${{ inputs.sentry-org }}
        SENTRY_PROJECT: ${{ inputs.sentry-project }}
      shell: pwsh
      run: |
        $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
        corepack enable
        corepack prepare yarn@4.18.1 --activate
        yarn install
        yarn build
        if (-not (Test-Path -LiteralPath 'dist/win-unpacked/AUTO-MAS.exe' -PathType Leaf)) {
          throw 'Electron 构建未生成 AUTO-MAS.exe'
        }
