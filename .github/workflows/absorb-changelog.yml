# 每天北京时间 23:30 统一入账 dev 上的碎片，也支持手动补跑。
# release/* 由准备发版在发版前直接编译剩余碎片，不参加晚间入账。
# schedule 只在默认分支触发，因此先确认 dev 已启用流程，再检出分支顶端入账。
# 机器人用 GITHUB_TOKEN 推送，不会触发别的工作流，也不会触发自己。

name: 入账更新日志碎片

on:
  schedule:
    - cron: '30 15 * * *' # UTC，北京时间 23:30
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  branches:
    name: 选择入账分支
    runs-on: ubuntu-latest
    # fork 上入账会删掉贡献者 PR 里的碎片；仅显式开启变量时允许实测。
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS' || vars.CHANGELOG_ABSORB_ON_FORK == 'true'
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: 选择 dev 分支
        id: branches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/changelog.py?ref=dev" >/dev/null 2>&1 \
              && gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/absorb-changelog.yml?ref=dev" >/dev/null 2>&1; then
              branches='["dev"]'
            else
              echo "::error::dev 尚未接入新的碎片入账流程"
              exit 1
            fi
          elif [ "$REF_NAME" = dev ]; then
            branches='["dev"]'
          else
            echo "::error::只能在 dev 分支上手动入账"
            exit 1
          fi
          echo "branches=$(echo "$branches" | jq -c .)" >> "$GITHUB_OUTPUT"

  absorb:
    name: 碎片入账
    runs-on: ubuntu-latest
    needs: branches
    if: needs.branches.outputs.branches != '[]'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.branches) }}
    # 与准备发版共用分支锁；已入账的碎片不会重复编译。
    concurrency:
      group: changelog-${{ matrix.branch }}
      cancel-in-progress: false
      queue: max

    steps:
      # 检出分支顶端而不是触发这次运行的提交：排队的运行如果检出旧 SHA，会把上一次已经
      # 入账并删除的碎片再编译一遍，再往分支上推必然冲突。
      - name: 检出分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 入账并推送
        id: absorb
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 推送被拒（期间又有人推了）就退回分支顶端重来，最多三次；不 rebase 过时的机器人提交
          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --hard --quiet "origin/$BRANCH"
            rm -f "$RUNNER_TEMP/absorb.json"
            python scripts/changelog.py absorb --repo "$GITHUB_REPOSITORY" \
              --summary-file "$RUNNER_TEMP/absorb.json" --github-output "$GITHUB_OUTPUT"
            git add --all changelog.d CHANGELOG.md res/version.json
            if git diff --cached --quiet; then
              echo "没有待入账的碎片"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            prs=$(python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); print(' '.join(f\"#{x['pr']}\" for x in d['absorbed'] if x['pr']))" "$RUNNER_TEMP/absorb.json")
            git commit --quiet -m "chore(changelog): 入账 ${prs:-碎片}"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "推送被拒，第 $attempt 次，退回分支顶端重试"
          done
          echo "::error::连续三次推送都被拒，请手动重跑本工作流"
          exit 1

      # GITHUB_TOKEN 的推送不触发 sync-cnb.yml，CNB 上的分支会少这一个机器人提交；
      # 与 build-app.yml 同样的做法，显式补一次同步。
      - name: 同步到 CNB
        if: steps.absorb.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: gh workflow run sync-cnb.yml --ref "$BRANCH"
