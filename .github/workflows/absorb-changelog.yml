name: 入账更新日志碎片

# 每日由 nightly.yml 的 cron 调用；手动选择任何入口分支也只检出和推送 dev。
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: '仅处理 dev（与入口分支选择无关）'
        type: choice
        options: [dev]
        default: dev
permissions:
  contents: write
  actions: write
concurrency:
  group: changelog-dev
  cancel-in-progress: false
jobs:
  absorb:
    runs-on: ubuntu-latest
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS' || vars.CHANGELOG_ABSORB_ON_FORK == 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 仅入账 dev，竞争时重新编译
        id: absorb
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/absorb.ps1
      - name: 同步 dev 源码到 CNB
        if: steps.absorb.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-cnb.yml --ref dev
          if ($LASTEXITCODE -ne 0) { throw '触发 dev 源码同步失败' }
