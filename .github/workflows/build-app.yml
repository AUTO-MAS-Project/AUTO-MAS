name: 构建并发布应用程序

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: '已合并发版 PR 的独立准备分支：codex/release-base-vX.Y.Z[-beta.N]'
        type: string
        required: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows 版本
    runs-on: windows-latest
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS'

    outputs:
      version_tag: ${{ steps.generate_version_info.outputs.version_tag }}
      is_prerelease: ${{ steps.generate_version_info.outputs.is_prerelease }}
      version_changelog: ${{ steps.generate_version_info.outputs.version_changelog }}
      note_cut_count: ${{ steps.generate_version_info.outputs.note_cut_count }}
      note_issue_title: ${{ steps.generate_version_info.outputs.note_issue_title }}
      note_issue_body: ${{ steps.generate_version_info.outputs.note_issue_body }}
      source_sha: ${{ steps.generate_version_info.outputs.source_sha }}

    steps:
      - name: 只构建独立发版准备分支
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        shell: pwsh
        run: |
          if ($env:RELEASE_BRANCH -notmatch '^codex/release-base-v\d+\.\d+\.\d+(-beta\.\d+)?$') { throw '仅允许 codex/release-base-v*；旧 release 后端来源不得用于版本准备' }

      - name: 签出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0

      - name: 读取 dev 上当前发布工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: .release-tools
          sparse-checkout: |
            scripts
            .github

      - name: 设定发布工具的源码根
        shell: pwsh
        run: '"AUTO_MAS_CHANGELOG_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV'

      - name: 设置 Python 环境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 生成版本信息
        id: generate_version_info
        run: |
          $versionTag = (python .release-tools/scripts/changelog.py current).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $versionTag) { throw "读不到当前版本号" }
          $notePath = Join-Path $env:RUNNER_TEMP 'release-note.md'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ('${{ inputs.release_branch }}' -ne "codex/release-base-$versionTag") { throw '分支与准备版本不符，发版 PR 尚未合并或版本被更改' }
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw '无法读取构建源码 SHA' }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          python .release-tools/scripts/changelog.py release-note --version $versionTag --output $notePath --github-output $env:GITHUB_OUTPUT --run-url $runUrl
          if ($LASTEXITCODE -ne 0) { throw "渲染 Release 正文失败" }
          $changelog = Get-Content -LiteralPath $notePath -Raw -Encoding utf8
          $isPrerelease = if ($versionTag.Contains('-')) { 'true' } else { 'false' }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_tag=$versionTag" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "is_prerelease=$isPrerelease" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_changelog<<$delimiter`n$changelog`n$delimiter" -Encoding utf8
          Write-Host "版本 $versionTag，预发布：$isPrerelease"
        shell: pwsh

      - name: 发布前置检查
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          VERSION_TAG: ${{ steps.generate_version_info.outputs.version_tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_AUTH_TOKEN)) {
            throw '缺少 GitHub Actions secret: SENTRY_AUTH_TOKEN'
          }
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_ORG)) {
            throw '缺少 GitHub Actions variable: SENTRY_ORG'
          }
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_PROJECT)) {
            throw '缺少 GitHub Actions variable: SENTRY_PROJECT'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw '缺少 GitHub Actions secret: SIGNPATH_API_TOKEN'
          }
          python .release-tools/scripts/changelog.py check
          if ($LASTEXITCODE -ne 0) { throw '生成物一致性检查失败' }
          python .release-tools/scripts/changelog.py guard
          if ($LASTEXITCODE -ne 0) { throw "发布守门未通过" }
          $releaseRef = "refs/heads/release/$env:VERSION_TAG"
          $remoteReleaseBranch = @(git ls-remote --heads origin $releaseRef)
          $lsRemoteExitCode = $LASTEXITCODE
          if ($lsRemoteExitCode -ne 0) {
            throw "查询远端分支失败（git ls-remote 退出码 $lsRemoteExitCode）"
          }
          if ($remoteReleaseBranch.Count -gt 0) {
            throw "远端已存在分支 release/$env:VERSION_TAG，发布阶段无法推送；请先处理该分支再构建"
          }
          Write-Host "前置检查通过：将发布 $env:VERSION_TAG"
        shell: pwsh

      - name: 下载并校验钉扎 Runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.release-tools/.github/scripts/download-runtime.ps1
        shell: pwsh

      - name: 设置 Node.js 环境
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: 构建应用程序
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          cd frontend
          corepack enable
          corepack prepare yarn@4.9.1 --activate
          yarn install --immutable
          if ($LASTEXITCODE -ne 0) { throw "依赖安装失败" }
          yarn build
          if ($LASTEXITCODE -ne 0) { throw "应用构建失败" }
          Move-Item -Path "dist\win-unpacked\AUTO-MAS.exe" -Destination "..\AUTO-MAS.exe"
        shell: pwsh

      - name: 放入 Runtime 可执行文件
        run: |
          $target = 'frontend\dist\win-unpacked\resources'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path 'runtime\auto-mas-runtime.exe' -Destination (Join-Path $target 'auto-mas-runtime.exe') -Force
        shell: pwsh

      - name: 上传未签名主程序
        id: upload-unsigned-main-program
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AUTO-MAS
          path: AUTO-MAS.exe

      - name: 签名主程序
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "787a1d5f-6177-4f30-9559-d2646473584a"
          project-slug: "AUTO_MAA"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "AUTO-MAS"
          github-artifact-id: "${{ steps.upload-unsigned-main-program.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: 'frontend\dist\win-unpacked'

      - name: 构建安装包
        uses: Minionguyjpro/Inno-Setup-Action@36abc9fdddc244a69f4895566fa5b2d8d5854e43 # v1.2.7
        env:
          VERSION_TAG: ${{ steps.generate_version_info.outputs.version_tag }}
        with:
          path: res/packaging/AUTO-MAS.iss
          options: |-
            /q

      - name: 创建便携包压缩包
        run: Compress-Archive -Path .\frontend\dist\win-unpacked\* -DestinationPath AUTO-MAS-${{ steps.generate_version_info.outputs.version_tag }}-x64.zip -Force
        shell: pwsh

      - name: 上传未签名安装程序
        if: steps.generate_version_info.outputs.is_prerelease != 'true'
        id: upload-unsigned-setup-program
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AUTO-MAS-Unsigned-Setup
          path: AUTO-MAS-Setup.exe

      - name: 签名安装程序
        if: steps.generate_version_info.outputs.is_prerelease != 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "787a1d5f-6177-4f30-9559-d2646473584a"
          project-slug: "AUTO_MAA"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "AUTO-MAS-Setup"
          github-artifact-id: "${{ steps.upload-unsigned-setup-program.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: Setup

      - name: 收集预发布版安装程序
        if: steps.generate_version_info.outputs.is_prerelease == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path Setup | Out-Null
          Move-Item -Path AUTO-MAS-Setup.exe -Destination Setup
        shell: pwsh

      - name: 创建安装程序压缩包
        run: Compress-Archive -Path .\Setup\AUTO-MAS-Setup.exe -DestinationPath AUTO-MAS-Setup-${{ steps.generate_version_info.outputs.version_tag }}-x64.zip -Force
        shell: pwsh

      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: AUTO-MAS-*-x64.zip
          retention-days: 30

  release:
    name: 发布 GitHub 发行版
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 签出本次构建源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: artifacts

      - name: 从构建 SHA 原子创建独立 release 来源与 tag
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git branch "release/$env:VERSION_TAG" $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw '创建独立后端分支失败' }
          git tag $env:VERSION_TAG $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw '创建 tag 失败，禁止覆盖历史 tag' }
          git push --atomic origin "refs/heads/release/$env:VERSION_TAG" "refs/tags/$env:VERSION_TAG"
          if ($LASTEXITCODE -ne 0) { throw '创建发布引用失败，禁止覆盖或强推' }

      - name: 读取源码同步工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: .release-tools
          sparse-checkout: .github/scripts
      - name: 同步本版后端来源到 CNB
        shell: pwsh
        env:
          CNB_GIT_TOKEN: ${{ secrets.GIT_PASSWORD }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
        run: ./.release-tools/.github/scripts/sync-cnb.ps1 -VersionTag $env:VERSION_TAG -SourceSha $env:SOURCE_SHA

      - name: 发布发行版
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build.outputs.version_tag }}
          body: |
            ${{ needs.build.outputs.version_changelog }}
            ## 代码签名策略 / Code Signing Policy

            免费代码签名由 [SignPath.io](https://signpath.io/) 提供，证书由 [SignPath Foundation](https://signpath.org/) 提供。

            - 审批人: [DLmaster (@DLmaster361)](https://github.com/DLmaster361)

            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).

            - Approvers: [DLmaster (@DLmaster361)](https://github.com/DLmaster361)

            ## 隐私政策 / Privacy Policy

            为更好地提供服务，AUTO-MAS 将自动收集以下信息：

            - 软件版本号
            - 运行时错误信息
            - 性能追踪信息

            AUTO-MAS 尊重并保护用户隐私。上述信息会在客户端完成脱敏后发送至 Sentry SaaS（美国区域）进行错误与性能分析；不会发送用户身份、Cookie、请求头、请求体、URL 查询参数、局部变量或本机绝对路径。匿名遥测默认开启，可在「设置 -> 功能设置」中关闭；关闭后前后端均不再发送遥测数据。

            To better serve you, AUTO-MAS will automatically collect the following information:

            - Software version number
            - Runtime error information
            - Performance tracing information

            AUTO-MAS respects and protects user privacy. This information is redacted on the client before being sent to Sentry SaaS (US region) for error and performance analysis. User identity, cookies, request headers, request bodies, URL query parameters, local variables, and absolute local paths are not sent. Anonymous telemetry is enabled by default and can be disabled under 「Settings -> Function Settings」; once disabled, neither the frontend nor backend sends telemetry data.

            [已有 Mirror酱 CDK ？前往 Mirror酱 高速下载](https://mirrorchyan.com/zh/projects?rid=AUTO_MAS&source=auto-mas-release)
          files: artifacts/*
          prerelease: ${{ needs.build.outputs.is_prerelease }}

      - name: 更新公告被熔断时开 issue 告知
        # 同一版重跑不重复开 issue：按标题找到已开的就追加评论。
        if: needs.build.outputs.note_cut_count != '' && needs.build.outputs.note_cut_count != '0'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ needs.build.outputs.note_issue_title }}
          ISSUE_BODY: ${{ needs.build.outputs.note_issue_body }}
        run: |
          $issues = gh issue list --state open --limit 100 --json number,title | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '查询公告 issue 失败' }
          $existing = $issues | Where-Object title -EQ $env:ISSUE_TITLE | Select-Object -First 1
          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-cut-issue.md'
          $env:ISSUE_BODY | Set-Content -LiteralPath $bodyPath -Encoding utf8
          if ($existing) { gh issue comment $existing.number --body-file $bodyPath }
          else { gh issue create --title $env:ISSUE_TITLE --body-file $bodyPath }
          if ($LASTEXITCODE -ne 0) { throw '写入公告 issue 失败' }

      - name: 标记 Sentry 生产部署
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN -or -not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
            Write-Warning '缺少 Sentry 配置，跳过部署登记。'
            exit 0
          }
          $releaseVersion = "auto-mas@$env:VERSION_TAG"
          $encodedOrg = [Uri]::EscapeDataString($env:SENTRY_ORG)
          $encodedRelease = [Uri]::EscapeDataString($releaseVersion)
          $releaseUrl = "https://github.com/$env:REPOSITORY/releases/tag/$env:VERSION_TAG"
          $payload = @{
            environment = 'production'
            name = "GitHub Release $env:VERSION_TAG"
            url = $releaseUrl
            projects = @($env:SENTRY_PROJECT)
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:SENTRY_AUTH_TOKEN"
          }
          try {
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://sentry.io/api/0/organizations/$encodedOrg/releases/$encodedRelease/deploys/" `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $payload | Out-Null
          } catch {
            Write-Warning "登记 Sentry 部署失败，不影响发布：$($_.Exception.Message)"
          }
        shell: pwsh

  cnb:
    name: 发布 CNB 发行版
    runs-on: ubuntu-latest
    needs: [build, release]
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS'
    steps:
      - name: 读取当前发布工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 安装发布工具依赖
        shell: pwsh
        run: |
          python -m pip install -r .github/workflows/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw '安装 CNB 发布依赖失败' }
      - name: 同次构建直接发布 CNB（不依赖 CNB 分支事件配置）
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ needs.build.outputs.version_changelog }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python .github/workflows/github_download_and_cnb_upload.py --cnb-token $env:CNB_TOKEN --github-token $env:GH_TOKEN --run-id '${{ github.run_id }}' --version-tag $env:VERSION_TAG --is-prerelease $env:IS_PRERELEASE --target-commitish $env:SOURCE_SHA --release-body $env:RELEASE_BODY
          if ($LASTEXITCODE -ne 0) { throw 'CNB 发布失败' }

  record-dev:
    name: 将开发线发布记录送回 dev 审核
    needs: [build, release, cnb, mirror]
    if: contains(needs.build.outputs.version_tag, '-beta.') || endsWith(needs.build.outputs.version_tag, '.0')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 创建开发线记录 PR（维护者合并后继续下一 beta）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if (-not $env:GH_TOKEN) { throw '需要 RELEASE_PR_TOKEN 才能创建开发线记录 PR' }
          $head = "release/$env:VERSION_TAG"
          $existing = gh pr list --base dev --head $head --state open --json number | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '查询记录 PR 失败' }
          if ($existing.Count -eq 0) {
            $body = Join-Path $env:RUNNER_TEMP 'record-dev.md'
            "- 将 $env:VERSION_TAG 的版本、更新日志与已消费碎片记录同步回 dev。`n- 保留 dev 后续未发布改动，冲突由维护者审核解决；补丁维护线不运行此步骤。" | Set-Content $body
            gh pr create --base dev --head $head --title "chore: 同步 $env:VERSION_TAG 开发线发布记录" --body-file $body --label changelog-maintenance --label skip-changelog
            if ($LASTEXITCODE -ne 0) { throw '创建记录 PR 失败' }
          }

  mirror:
    name: 推送镜像版本
    runs-on: macos-latest
    needs: [build, release, cnb]

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: 上传安装包
        uses: MirrorChyan/uploading-action@ea9a0f6f516fafb6b0a3046a1fe4b0dccb29eca8 # v1
        with:
          filetype: local
          filename: AUTO-MAS-Setup-${{ needs.build.outputs.version_tag }}-x64.zip
          version_name: ${{ needs.build.outputs.version_tag }}
          mirrorchyan_rid: AUTO_MAS
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          os: windows
          arch: x64
          channel: ${{ needs.build.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}

      - name: 上传版本说明
        uses: MirrorChyan/release-note-action@f392b50c411981ee6d33c8ed5e91d66d84d56202 # v1
        with:
          version_name: ${{ needs.build.outputs.version_tag }}
          release_note: ${{ needs.build.outputs.version_changelog }}
          channel: ${{ needs.build.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}
          mirrorchyan_rid: AUTO_MAS
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

      - name: 触发自建源更新
        shell: pwsh
        env:
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: |
          if (-not $env:UPDATE_URL) { throw '缺少自建源 UPDATE_URL' }
          $channel = if ($env:IS_PRERELEASE -eq 'true') { 'beta' } else { 'stable' }
          $payload = @{ version=$env:VERSION_TAG; res_id='AUTO_MAS'; channel=$channel; os='win'; arch='x64' } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri $env:UPDATE_URL -ContentType 'application/json' -Body $payload | Out-Null
