name: 构建并发布应用程序

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: build-app
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows 版本
    runs-on: windows-latest
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS' && (github.ref_name == 'main' || github.ref_name == 'dev' || startsWith(github.ref_name, 'release/'))

    outputs:
      version_tag: ${{ steps.generate_version_info.outputs.version_tag }}
      is_prerelease: ${{ steps.generate_version_info.outputs.is_prerelease }}
      version_changelog: ${{ steps.generate_version_info.outputs.version_changelog }}
      note_cut_count: ${{ steps.generate_version_info.outputs.note_cut_count }}
      note_issue_title: ${{ steps.generate_version_info.outputs.note_issue_title }}
      note_issue_body: ${{ steps.generate_version_info.outputs.note_issue_body }}

    steps:
      - name: 签出代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: 生成版本信息
        id: generate_version_info
        run: |
          $versionTag = (python scripts/changelog.py current).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $versionTag) { throw "读不到当前版本号" }
          $notePath = Join-Path $env:RUNNER_TEMP 'release-note.md'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python scripts/changelog.py release-note --version $versionTag --output $notePath --github-output $env:GITHUB_OUTPUT --run-url $runUrl
          if ($LASTEXITCODE -ne 0) { throw "渲染 Release 正文失败" }
          $changelog = Get-Content -LiteralPath $notePath -Raw -Encoding utf8
          $isPrerelease = if ($versionTag.Contains('-')) { 'true' } else { 'false' }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_tag=$versionTag" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "is_prerelease=$isPrerelease" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_changelog<<$delimiter`n$changelog`n$delimiter" -Encoding utf8
          Write-Host "版本 $versionTag，预发布：$isPrerelease"
        shell: pwsh

      - name: 发布前置检查
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          VERSION_TAG: ${{ steps.generate_version_info.outputs.version_tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_AUTH_TOKEN)) {
            throw '缺少 GitHub Actions secret: SENTRY_AUTH_TOKEN'
          }
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_ORG)) {
            throw '缺少 GitHub Actions variable: SENTRY_ORG'
          }
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_PROJECT)) {
            throw '缺少 GitHub Actions variable: SENTRY_PROJECT'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw '缺少 GitHub Actions secret: SIGNPATH_API_TOKEN'
          }
          python scripts/changelog.py guard
          if ($LASTEXITCODE -ne 0) { throw "发布守门未通过" }
          $releaseRef = "refs/heads/release/$env:VERSION_TAG"
          $remoteReleaseBranch = @(git ls-remote --heads origin $releaseRef)
          $lsRemoteExitCode = $LASTEXITCODE
          if ($lsRemoteExitCode -ne 0) {
            throw "查询远端分支失败（git ls-remote 退出码 $lsRemoteExitCode）"
          }
          if ($remoteReleaseBranch.Count -gt 0) {
            throw "远端已存在分支 release/$env:VERSION_TAG，发布阶段无法推送；请先处理该分支再构建"
          }
          Write-Host "前置检查通过：将发布 $env:VERSION_TAG"
        shell: pwsh

      - name: 读取 Runtime 版本
        run: |
          $runtimeVersionFile = Join-Path '${{ github.workspace }}' 'res\runtime-version.txt'
          $runtimeVersion = (Get-Content -LiteralPath $runtimeVersionFile -Raw).Trim()
          if ($runtimeVersion -notmatch '^v\d+(\.\d+)*([-+][0-9A-Za-z.-]+)?$') {
            throw "Runtime 版本格式无效：$runtimeVersion"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUNTIME_VERSION=$runtimeVersion" -Encoding utf8
          Write-Host "本次构建使用 Runtime $runtimeVersion"
        shell: pwsh

      - name: 下载并校验 Runtime 可执行文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runtimeDir = Join-Path "${{ github.workspace }}" 'runtime'
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          $exeName = "auto-mas-runtime-$env:RUNTIME_VERSION.exe"

          gh release download $env:RUNTIME_VERSION `
            -R AUTO-MAS-Project/AUTO-MAS-Runtime `
            -D $runtimeDir `
            -p $exeName `
            -p 'SHA256SUMS.txt' `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "下载 Runtime $env:RUNTIME_VERSION 失败"
          }

          Push-Location $runtimeDir
          try {
            $sumsLine = Select-String -Path 'SHA256SUMS.txt' -Pattern ([regex]::Escape($exeName)) |
              Select-Object -First 1
            if (-not $sumsLine) {
              throw "SHA256SUMS.txt 中找不到 $exeName 对应的记录"
            }
            $expectedHash = ($sumsLine.Line -split '\s+')[0].ToUpperInvariant()
            $actualHash = (Get-FileHash -Path $exeName -Algorithm SHA256).Hash.ToUpperInvariant()

            Write-Host "期望哈希: $expectedHash"
            Write-Host "实际哈希: $actualHash"

            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 校验失败：$exeName 与 SHA256SUMS.txt 不匹配，可能下载损坏或被篡改"
            }

            # Electron 侧固定按 auto-mas-runtime.exe 定位（frontend/electron/services/runtime/launchConfig.ts）
            Move-Item -Path $exeName -Destination 'auto-mas-runtime.exe' -Force
            Remove-Item 'SHA256SUMS.txt'
            Write-Host "Runtime $env:RUNTIME_VERSION 校验通过：$runtimeDir\auto-mas-runtime.exe"
          } finally {
            Pop-Location
          }
        shell: pwsh

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: 构建应用程序
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          cd frontend
          corepack enable
          corepack prepare yarn@4.9.1 --activate
          yarn install
          yarn build
          Move-Item -Path "dist\win-unpacked\AUTO-MAS.exe" -Destination "..\AUTO-MAS.exe"
        shell: pwsh

      - name: 放入 Runtime 可执行文件
        run: |
          $target = 'frontend\dist\win-unpacked\resources'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path 'runtime\auto-mas-runtime.exe' -Destination (Join-Path $target 'auto-mas-runtime.exe') -Force
        shell: pwsh

      - name: 上传未签名主程序
        id: upload-unsigned-main-program
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AUTO-MAS
          path: AUTO-MAS.exe

      - name: 签名主程序
        uses: signpath/github-action-submit-signing-request@v2.3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "787a1d5f-6177-4f30-9559-d2646473584a"
          project-slug: "AUTO_MAA"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "AUTO-MAS"
          github-artifact-id: "${{ steps.upload-unsigned-main-program.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: 'frontend\dist\win-unpacked'

      - name: 构建安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        env:
          VERSION_TAG: ${{ steps.generate_version_info.outputs.version_tag }}
        with:
          path: res/packaging/AUTO-MAS.iss
          options: |-
            /q

      - name: 创建便携包压缩包
        run: Compress-Archive -Path .\frontend\dist\win-unpacked\* -DestinationPath AUTO-MAS-${{ steps.generate_version_info.outputs.version_tag }}-x64.zip -Force
        shell: pwsh

      - name: 上传未签名安装程序
        if: steps.generate_version_info.outputs.is_prerelease != 'true'
        id: upload-unsigned-setup-program
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AUTO-MAS-Unsigned-Setup
          path: AUTO-MAS-Setup.exe

      - name: 签名安装程序
        if: steps.generate_version_info.outputs.is_prerelease != 'true'
        uses: signpath/github-action-submit-signing-request@v2.3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "787a1d5f-6177-4f30-9559-d2646473584a"
          project-slug: "AUTO_MAA"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "AUTO-MAS-Setup"
          github-artifact-id: "${{ steps.upload-unsigned-setup-program.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: Setup

      - name: 收集预发布版安装程序
        if: steps.generate_version_info.outputs.is_prerelease == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path Setup | Out-Null
          Move-Item -Path AUTO-MAS-Setup.exe -Destination Setup
        shell: pwsh

      - name: 创建安装程序压缩包
        run: Compress-Archive -Path .\Setup\AUTO-MAS-Setup.exe -DestinationPath AUTO-MAS-Setup-${{ steps.generate_version_info.outputs.version_tag }}-x64.zip -Force
        shell: pwsh

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifacts
          path: AUTO-MAS-*-x64.zip
          retention-days: 30

  release:
    name: 发布 GitHub 发行版
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 签出代码
        uses: actions/checkout@v7.0.1

      - name: 下载构建产物
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-artifacts
          path: artifacts

      - name: 创建发行版分支与标签
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          NEW_BRANCH="release/${{ needs.build.outputs.version_tag }}"
          TAG_NAME="${{ needs.build.outputs.version_tag }}"

          echo "Creating branch: $NEW_BRANCH"
          echo "Creating tag: $TAG_NAME"

          git checkout -b "$NEW_BRANCH"
          git push origin "$NEW_BRANCH"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: 同步发行版分支到 CNB
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync-cnb.yml --ref "release/${{ needs.build.outputs.version_tag }}"

      - name: 发布发行版
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build.outputs.version_tag }}
          body: |
            ${{ needs.build.outputs.version_changelog }}
            ## 代码签名策略 / Code Signing Policy

            免费代码签名由 [SignPath.io](https://signpath.io/) 提供，证书由 [SignPath Foundation](https://signpath.org/) 提供。

            - 审批人: [DLmaster (@DLmaster361)](https://github.com/DLmaster361)

            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).

            - Approvers: [DLmaster (@DLmaster361)](https://github.com/DLmaster361)

            ## 隐私政策 / Privacy Policy

            为更好地提供服务，AUTO-MAS 将自动收集以下信息：

            - 软件版本号
            - 运行时错误信息
            - 性能追踪信息

            AUTO-MAS 尊重并保护用户隐私。上述信息会在客户端完成脱敏后发送至 Sentry SaaS（美国区域）进行错误与性能分析；不会发送用户身份、Cookie、请求头、请求体、URL 查询参数、局部变量或本机绝对路径。匿名遥测默认开启，可在「设置 -> 功能设置」中关闭；关闭后前后端均不再发送遥测数据。

            To better serve you, AUTO-MAS will automatically collect the following information:

            - Software version number
            - Runtime error information
            - Performance tracing information

            AUTO-MAS respects and protects user privacy. This information is redacted on the client before being sent to Sentry SaaS (US region) for error and performance analysis. User identity, cookies, request headers, request bodies, URL query parameters, local variables, and absolute local paths are not sent. Anonymous telemetry is enabled by default and can be disabled under 「Settings -> Function Settings」; once disabled, neither the frontend nor backend sends telemetry data.

            [已有 Mirror酱 CDK ？前往 Mirror酱 高速下载](https://mirrorchyan.com/zh/projects?rid=AUTO_MAS&source=auto-mas-release)
          files: artifacts/*
          prerelease: ${{ needs.build.outputs.is_prerelease }}

      - name: 更新公告被熔断时开 issue 告知
        # 同一版重跑不重复开 issue：按标题找到已开的就追加评论。
        if: needs.build.outputs.note_cut_count != '' && needs.build.outputs.note_cut_count != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ needs.build.outputs.note_issue_title }}
          ISSUE_BODY: ${{ needs.build.outputs.note_issue_body }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg title "$ISSUE_TITLE" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$ISSUE_BODY"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
          fi

      - name: 标记 Sentry 生产部署
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN -or -not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
            Write-Warning '缺少 Sentry 配置，跳过部署登记。'
            exit 0
          }
          $releaseVersion = "auto-mas@$env:VERSION_TAG"
          $encodedOrg = [Uri]::EscapeDataString($env:SENTRY_ORG)
          $encodedRelease = [Uri]::EscapeDataString($releaseVersion)
          $releaseUrl = "https://github.com/$env:REPOSITORY/releases/tag/$env:VERSION_TAG"
          $payload = @{
            environment = 'production'
            name = "GitHub Release $env:VERSION_TAG"
            url = $releaseUrl
            projects = @($env:SENTRY_PROJECT)
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:SENTRY_AUTH_TOKEN"
          }
          try {
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://sentry.io/api/0/organizations/$encodedOrg/releases/$encodedRelease/deploys/" `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $payload | Out-Null
          } catch {
            Write-Warning "登记 Sentry 部署失败，不影响发布：$($_.Exception.Message)"
          }
        shell: pwsh

  cnb:
    name: 发布 CNB 发行版
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS' && (github.ref_name == 'main' || github.ref_name == 'dev' || startsWith(github.ref_name, 'release/'))

    steps:
      - name: 签出代码
        uses: actions/checkout@v7.0.1

      - name: 设置 Python 环境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      - name: 触发 CNB 构建
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_BODY: ${{ needs.build.outputs.version_changelog }}
          VERSION_TAG: ${{ needs.build.outputs.version_tag }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
        run: |
          python .github/workflows/cnb_trigger.py "$CNB_TOKEN" \
            --branch "${{ github.ref_name }}" \
            --runid "${{ github.run_id }}" \
            --release-body "$RELEASE_BODY" \
            --version-tag "$VERSION_TAG" \
            --is-prerelease "$IS_PRERELEASE"

  mirror:
    name: 推送镜像版本
    runs-on: macos-latest
    needs: [build, release, cnb]

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: 上传安装包
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: local
          filename: AUTO-MAS-Setup-${{ needs.build.outputs.version_tag }}-x64.zip
          version_name: ${{ needs.build.outputs.version_tag }}
          mirrorchyan_rid: AUTO_MAS
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          os: windows
          arch: x64

      - name: 上传版本说明
        uses: MirrorChyan/release-note-action@v1
        with:
          version_name: ${{ needs.build.outputs.version_tag }}
          release_note: ${{ needs.build.outputs.version_changelog }}
          mirrorchyan_rid: AUTO_MAS
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

      - name: 触发自建源更新
        run: |
          if [ "${{ needs.build.outputs.is_prerelease }}" = "true" ]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi

          PAYLOAD=$(jq -n \
            --arg version "${{ needs.build.outputs.version_tag }}" \
            --arg res_id "AUTO_MAS" \
            --arg channel "$CHANNEL" \
            --arg os "win" \
            --arg arch "x64" \
            '{version: $version, res_id: $res_id, channel: $channel, os: $os, arch: $arch}')

          curl -X POST "${{ secrets.UPDATE_URL }}" -H "Content-Type: application/json" -d "$PAYLOAD"
