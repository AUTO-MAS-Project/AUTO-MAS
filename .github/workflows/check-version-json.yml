name: 检查版本信息

on:
  # 直推 dev / main 破坏版本号一致性时当场报错，而不是等到别人开 PR 才发现。
  push:
    branches: [dev, main]
    paths:
      - res/version.json
      - frontend/package.json
      - app/core/config.py
      - pyproject.toml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-version-consistency:
    name: 检查版本号一致性
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 检查 version.json 语法
        run: python -m json.tool res/version.json > /dev/null

      # 四处版本号的位置由 bump_version.py 统一定义，改版本号也走同一个脚本。
      - name: 检查版本号一致性
        run: python .github/workflows/bump_version.py --check

  check-version-json:
    name: 检查 version.json 变更
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 检查 PR 文件列表
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            if (!files.some(file => file.filename === 'res/version.json')) {
              core.setFailed('每个 PR 都必须包含对 res/version.json 的更改。');
            }
