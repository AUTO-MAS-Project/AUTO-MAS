name: CI 构建产物

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 构建未签名 Windows 包
    runs-on: windows-latest

    steps:
      - name: 签出代码
        uses: actions/checkout@v7.0.1

      - name: 生成产物名称
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'res/version.json' -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "res/version.json 中的版本号无效：$version"
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version_tag=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "short_sha=$shortSha"
          Write-Host "版本 $version，提交 $shortSha"

      - name: 构建并准备 Windows 解压包
        uses: ./.github/actions/build-windows-unpacked
        with:
          github-token: ${{ github.token }}

      - name: 生成便携包
        env:
          PORTABLE_NAME: AUTO-MAS-${{ steps.metadata.outputs.version_tag }}-${{ steps.metadata.outputs.short_sha }}-x64.zip
        shell: pwsh
        run: |
          Compress-Archive -Path 'frontend/dist/win-unpacked/*' `
            -DestinationPath $env:PORTABLE_NAME -Force

      - name: 构建安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        env:
          VERSION_TAG: ${{ steps.metadata.outputs.version_tag }}
        with:
          path: res/packaging/AUTO-MAS.iss
          options: /q

      - name: 收集构建产物
        env:
          PORTABLE_NAME: AUTO-MAS-${{ steps.metadata.outputs.version_tag }}-${{ steps.metadata.outputs.short_sha }}-x64.zip
          SETUP_NAME: AUTO-MAS-Setup-${{ steps.metadata.outputs.version_tag }}-${{ steps.metadata.outputs.short_sha }}.exe
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'dist/ci-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Move-Item -LiteralPath $env:PORTABLE_NAME -Destination $artifactDir
          Move-Item -LiteralPath 'AUTO-MAS-Setup.exe' -Destination (Join-Path $artifactDir $env:SETUP_NAME)

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AUTO-MAS-${{ steps.metadata.outputs.version_tag }}-${{ steps.metadata.outputs.short_sha }}
          path: dist/ci-artifacts/*
          if-no-files-found: error
