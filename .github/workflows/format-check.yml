name: Format Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: 格式检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          python-version: "3.12"

      - name: 检查 Python 格式
        run: |
          uv sync --locked
          uv run --no-sync ruff format --check .

      - name: 设置 Node.js 环境
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: 设置 Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate

      - name: 安装前端依赖
        working-directory: frontend
        run: yarn install --immutable --mode=skip-build

      - name: 检查前端 Lint
        working-directory: frontend
        run: yarn lint

      - name: 检查前端类型
        working-directory: frontend
        run: yarn typecheck

      - name: 检查前端格式
        working-directory: frontend
        run: yarn format:check

      # 词表门禁：缺译、占位符差异、源码在用但没有的 key、死词条、模板硬编码中文，
      # 全部按 0 判定；口径见 frontend/scripts/i18n-audit.mjs。
      - name: 检查词表完整性
        working-directory: frontend
        run: yarn audit:i18n --check

      # E2E 浏览器流程不在 CI 跑；这里只守基础设施契约（数据根隔离、配置种子白名单、
      # 启动参数），一秒内跑完，且不需要装依赖或启动服务。
      - name: 检查 E2E 基础设施契约
        working-directory: frontend
        run: node --test e2e/harness.check.mjs
