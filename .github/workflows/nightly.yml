name: 每晚构建 dev alpha
on:
  schedule:
    # UTC 18:00 = 次日北京时间 02:00；先入账，再检出 dev。
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nightly-dev
  cancel-in-progress: false
jobs:
  absorb:
    uses: ./.github/workflows/absorb-changelog.yml
    secrets: inherit
  build:
    needs: absorb
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      built: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 读取上次完整发布状态并比较本次源码 SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_automation.py nightly-check --state previous-nightly.json
          if ($LASTEXITCODE -ne 0) { throw 'nightly 状态检查失败' }
      - name: 仅在本次构建工作区注入 alpha 版本
        if: steps.check.outputs.build == 'true'
        id: version
        run: |
          python .github/scripts/release_automation.py nightly-version --number '${{ github.run_number }}'
          if ($LASTEXITCODE -ne 0) { throw 'alpha 版本注入失败' }
      - name: 下载并校验钉扎 Runtime
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/download-runtime.ps1 -RequireAlpha
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.build == 'true'
        with:
          node-version: '20'
      - name: 构建未签名应用
        if: steps.check.outputs.build == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          Set-Location frontend
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'corepack 失败' }
          corepack prepare yarn@4.9.1 --activate
          if ($LASTEXITCODE -ne 0) { throw 'yarn 准备失败' }
          yarn install --immutable
          if ($LASTEXITCODE -ne 0) { throw '依赖安装失败' }
          yarn build
          if ($LASTEXITCODE -ne 0) { throw '应用构建失败' }
          Copy-Item ../runtime/auto-mas-runtime.exe dist/win-unpacked/resources/auto-mas-runtime.exe -Force
      - name: 构建未签名安装包
        if: steps.check.outputs.build == 'true'
        uses: Minionguyjpro/Inno-Setup-Action@36abc9fdddc244a69f4895566fa5b2d8d5854e43 # v1.2.7
        env:
          VERSION_TAG: ${{ steps.version.outputs.version }}
          WINDOWS_VERSION: ${{ steps.version.outputs.windows_version }}
        with:
          path: res/packaging/AUTO-MAS.iss
          options: /q
      - name: 打包安装包、便携包与构建元数据
        if: steps.check.outputs.build == 'true'
        env:
          VERSION_TAG: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.check.outputs.source_sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw '源码 SHA 已变化' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive frontend/dist/win-unpacked/* "artifacts/AUTO-MAS-$env:VERSION_TAG-x64.zip"
          Compress-Archive AUTO-MAS-Setup.exe "artifacts/AUTO-MAS-Setup-$env:VERSION_TAG-x64.zip"
          Copy-Item previous-nightly.json artifacts/
          @{ source_sha=$env:SOURCE_SHA; version=$env:VERSION_TAG; run_id=$env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content artifacts/build-source.json -Encoding utf8
          Copy-Item .github/scripts/release_automation.py artifacts/
      - name: 完整产物先上传 Actions（30 天）
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ github.run_id }}
          overwrite: true
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-${{ github.run_id }}
          path: artifacts
      - name: 仅重建 dev tag/Release，附件齐全才公开
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          VERSION_TAG: ${{ needs.build.outputs.version }}
        run: |
          python artifacts/release_automation.py nightly-publish --sha $env:SOURCE_SHA --version $env:VERSION_TAG --artifacts artifacts
          if ($LASTEXITCODE -ne 0) { throw 'nightly 发布失败，完整产物仍在 Actions' }
