name: 准备发版
# 从 main/dev 入口运行；所有版本在独立准备分支组装，旧 release 来源不接收准备提交。
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'beta 公测；stable 转正；patch 正式补丁；explicit 指定版本'
        type: choice
        options: [beta, stable, patch, explicit]
        default: beta
        required: true
      version:
        description: '仅 explicit：vX.Y.Z 或 vX.Y.Z-beta.N'
        type: string
      base_version:
        description: 'patch 必填：维护线最新正式 tag，如 v5.6.0；explicit 补丁也必须填'
        type: string
      fix_commits:
        description: '补丁必填：修复 SHA，按依赖顺序用空格分隔；含旧 release 上保留碎片的修复'
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
      AUTO_MAS_CHANGELOG_ROOT: ${{ github.workspace }}
    steps:
      - name: 要求可写工作流并触发 PR 检查的令牌
        run: |
          if (-not $env:GH_TOKEN) { throw '需要 RELEASE_PR_TOKEN：Contents/Pull requests/Workflows 写权限' }
          if ('${{ github.ref_name }}' -notin @('main', 'dev')) { throw '请从 main 或 dev 入口运行，勿从旧 release 分支运行' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 保存工具并拉取全部基准与修复
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'release-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item scripts/changelog.py $tools/
          Copy-Item .github/scripts/release_automation.py $tools/
          git fetch origin
          if ($LASTEXITCODE -ne 0) { throw '拉取分支失败' }
          git fetch origin --tags
          if ($LASTEXITCODE -ne 0) { throw '拉取 tag 失败' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 在独立分支组装指定源码
        id: source
        env:
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          BASE_VERSION: ${{ inputs.base_version }}
          FIX_COMMITS: ${{ inputs.fix_commits }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'release-tools'
          python "$tools/release_automation.py" prepare --changelog "$tools/changelog.py" --kind $env:KIND --version "$env:VERSION" --base-version "$env:BASE_VERSION" --fixes "$env:FIX_COMMITS"
          if ($LASTEXITCODE -ne 0) { throw '组装失败；检查基准、修复依赖、冲突及兼容性' }
      - name: 编译所选快照全部剩余碎片并验证
        env:
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'release-tools/changelog.py'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $argsList = @('release', '--kind', $env:KIND, '--body-file', "$env:RUNNER_TEMP/pr-body.md", '--step-summary', $env:GITHUB_STEP_SUMMARY, '--run-url', $runUrl)
          if ($env:VERSION) { $argsList += @('--version', $env:VERSION) }
          if ($env:BASE_VERSION) { $argsList += @('--base-version', $env:BASE_VERSION) }
          python $tool @argsList
          if ($LASTEXITCODE -ne 0) { throw '准备发版失败' }
          python $tool check
          if ($LASTEXITCODE -ne 0) { throw '生成物检查失败' }
          python $tool guard
          if ($LASTEXITCODE -ne 0) { throw '发版守门失败' }
      - name: 创建准备分支和发版 PR
        env:
          BASE_BRANCH: ${{ steps.source.outputs.base }}
          HEAD_BRANCH: ${{ steps.source.outputs.head }}
          VERSION_TAG: ${{ steps.source.outputs.version }}
        run: |
          # base 指向组装后的源码；版本提升仅在 head 的发版 PR 中。
          git checkout -b $env:HEAD_BRANCH
          if ($LASTEXITCODE -ne 0) { throw '创建 PR 分支失败' }
          git add CHANGELOG.md res/version.json frontend/package.json app/core/config.py pyproject.toml uv.lock changelog.d
          if ($LASTEXITCODE -ne 0) { throw '暂存失败' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw '差异检查失败' }
          git commit -m "chore(release): $env:VERSION_TAG"
          if ($LASTEXITCODE -ne 0) { throw '准备提交失败' }
          git push --atomic origin $env:BASE_BRANCH $env:HEAD_BRANCH
          if ($LASTEXITCODE -ne 0) { throw '创建准备分支失败' }
          gh pr create --base $env:BASE_BRANCH --head $env:HEAD_BRANCH --title "Release $env:VERSION_TAG" --body-file "$env:RUNNER_TEMP/pr-body.md" --label release
          if ($LASTEXITCODE -ne 0) { throw 'PR 创建失败；分支保留，可手动续建 PR' }
          "合并后从 main 的构建入口选择 $env:BASE_BRANCH；不要合回旧 release 或 dev。" >> $env:GITHUB_STEP_SUMMARY
