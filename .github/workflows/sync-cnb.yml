name: Sync to CNB
on:
  push:
  create:
  # 发行版分支由 build-app.yml 用 GITHUB_TOKEN 推送，而 GITHUB_TOKEN 造成的 push /
  # create **不会**触发其它工作流，本工作流因此不会为发版跑一次——CNB 上于是缺当版
  # release/vX.Y.Z 分支，而 Runtime 首次克隆受管工作区正是按 [cnb, github] 顺序找它。
  # build-app.yml 在创建引用后直接执行冻结的同步脚本；本入口用于普通源码推送，
  # 也可以在 Actions 页面手动跑一次，给漏同步的历史版本补分支。
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'AUTO-MAS-Project'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      
      - name: 读取 dev 当前的源码同步工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: .sync-tools
          sparse-checkout: .github/scripts
      - name: Sync to CNB Repository
        shell: pwsh
        env:
          CNB_GIT_TOKEN: ${{ secrets.GIT_PASSWORD }}
        run: |
          $tool = './.sync-tools/.github/scripts/sync-cnb.ps1'
          if (-not (Test-Path -LiteralPath $tool)) {
            Write-Warning 'dev 尚未安装同步工具；合入后重新运行 Sync to CNB。'
            exit 0
          }
          & $tool
