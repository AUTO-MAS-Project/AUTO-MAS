name: 同步 dev 工作流到 main PR

# 首次启用需将本工作流随 .github 同步到默认分支 main，之后才会显示手动运行按钮。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-github-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
    steps:
      - name: 检查工作流写权限令牌
        run: |
          if (-not $env:GH_TOKEN) {
            throw '需要 WORKFLOW_TOKEN：Contents/Pull requests/Workflows 写权限，不能回退到 GITHUB_TOKEN'
          }

      - name: 签出 dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/dev
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 创建或更新仅同步 .github 的 PR
        run: |
          # 切换 main 基线后仍使用 dev 的脚本。
          $script = Join-Path $env:RUNNER_TEMP 'sync_github_main.py'
          Copy-Item .github/scripts/sync_github_main.py $script
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python $script
          if ($LASTEXITCODE -ne 0) { throw '同步 PR 失败；不改写同步分支历史' }
