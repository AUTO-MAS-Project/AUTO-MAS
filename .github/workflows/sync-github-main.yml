name: 同步 dev 工作流到 main PR

# 首次启用需将本工作流随 .github 同步到默认分支 main，之后才会显示手动运行按钮。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-github-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检查工作流写权限令牌
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw '需要 WORKFLOW_TOKEN：Contents/Pull requests/Workflows 写权限，不能回退到 GITHUB_TOKEN'
          }

      - name: 签出 main 的工作流快照
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 设置 Python 环境
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: 创建或更新仅同步 .github 的 PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          # 只运行 main 快照的脚本，待同步的 dev 内容仅作为数据。
          $script = Join-Path $env:RUNNER_TEMP 'sync_github_main.py'
          Copy-Item .github/scripts/sync_github_main.py $script
          gh auth setup-git --hostname github.com
          if ($LASTEXITCODE -ne 0) { throw '配置 Git 凭据助手失败' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python $script
          if ($LASTEXITCODE -ne 0) { throw '同步 PR 失败；不改写同步分支历史' }
