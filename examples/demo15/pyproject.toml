[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-demo15"
version = "0.1.0"
description = "AUTO-MAS 声明式配置编辑示例"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["auto-mas-core"]
keywords = ["auto-mas-plugin", "auto-mas-id:demo15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demo15 = ["ui/*"]
