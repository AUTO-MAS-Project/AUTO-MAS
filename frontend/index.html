<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTO-MAS</title>
    <style>
      /* 防止启动时的白屏闪烁 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f5f5;
        color: #1f1f1f;
      }

      /* 深色模式支持 */
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #000000;
          color: rgba(255, 255, 255, 0.88);
        }
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .app-boot-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
      }

      .app-boot-panel {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid rgba(5, 5, 5, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }

      .app-boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #d9d9d9;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-boot-fallback {
          background: #000000;
        }

        .app-boot-panel {
          border-color: rgba(253, 253, 253, 0.12);
          background: #1f1f1f;
          box-shadow: 0 8px 24px rgb(0 0 0 / 32%);
        }

        .app-boot-spinner {
          border-color: #424242;
          border-top-color: #1668dc;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-fallback" aria-live="polite">
        <div class="app-boot-panel">
          <div class="app-boot-spinner"></div>
          <span>AUTO-MAS 正在加载</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
