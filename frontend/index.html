<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTO-MAS</title>
    <style>
      /* 防止启动时的白屏闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f5f5;
        color: #1f1f1f;
      }

      /* 深色模式支持 */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #000000;
          color: rgba(255, 255, 255, 0.88);
        }
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .app-boot-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .app-boot-panel {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid rgba(5, 5, 5, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
        font-size: 14px;
        line-height: 1.4;
      }

      .app-boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #d9d9d9;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 启动错误状态 */
      .app-boot-error {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        border: 1px solid rgba(255, 77, 79, 0.3);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgb(0 0 0 / 10%);
        max-width: 420px;
        text-align: center;
      }

      .app-boot-error.visible {
        display: flex;
      }

      .app-boot-error-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff1f0;
        color: #ff4d4f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        line-height: 1;
      }

      .app-boot-error-title {
        font-size: 16px;
        font-weight: 600;
        color: #1f1f1f;
      }

      .app-boot-error-detail {
        font-size: 13px;
        color: #8c8c8c;
        line-height: 1.5;
        word-break: break-all;
      }

      .app-boot-error-actions {
        display: flex;
        gap: 8px;
      }

      .app-boot-error-btn {
        padding: 6px 16px;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        background: #ffffff;
        font-size: 13px;
        cursor: pointer;
        color: #1f1f1f;
        line-height: 1.4;
      }

      .app-boot-error-btn:hover {
        border-color: #1677ff;
        color: #1677ff;
      }

      .app-boot-error-btn.primary {
        background: #1677ff;
        color: #ffffff;
        border-color: #1677ff;
      }

      .app-boot-error-btn.primary:hover {
        background: #4096ff;
      }

      /* 隐藏 spinner 当错误出现时 */
      .app-boot-fallback.has-error .app-boot-panel {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .app-boot-fallback {
          background: #000000;
        }

        .app-boot-panel {
          border-color: rgba(253, 253, 253, 0.12);
          background: #1f1f1f;
          box-shadow: 0 8px 24px rgb(0 0 0 / 32%);
        }

        .app-boot-spinner {
          border-color: #424242;
          border-top-color: #1668dc;
        }

        .app-boot-error {
          border-color: rgba(255, 77, 79, 0.3);
          background: #1f1f1f;
          box-shadow: 0 8px 24px rgb(0 0 0 / 32%);
        }

        .app-boot-error-icon {
          background: #2a1215;
        }

        .app-boot-error-title {
          color: rgba(255, 255, 255, 0.88);
        }

        .app-boot-error-detail {
          color: rgba(255, 255, 255, 0.45);
        }

        .app-boot-error-btn {
          background: #1f1f1f;
          border-color: #424242;
          color: rgba(255, 255, 255, 0.88);
        }

        .app-boot-error-btn:hover {
          border-color: #1668dc;
          color: #1668dc;
        }

        .app-boot-error-btn.primary {
          background: #1668dc;
          color: #ffffff;
          border-color: #1668dc;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-fallback" id="app-boot-fallback" aria-live="polite">
        <div class="app-boot-panel" id="app-boot-panel">
          <div class="app-boot-spinner"></div>
          <span>AUTO-MAS 正在加载</span>
        </div>
        <div class="app-boot-error" id="app-boot-error">
          <div class="app-boot-error-icon">!</div>
          <div class="app-boot-error-title">启动失败</div>
          <div class="app-boot-error-detail" id="app-boot-error-detail">
            无法加载应用页面，请检查安装是否完整。
          </div>
          <div class="app-boot-error-actions">
            <button id="app-boot-retry" class="app-boot-error-btn primary">重试</button>
            <button id="app-boot-quit" class="app-boot-error-btn">安全退出</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootFallback.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
