[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_mas_core"
dynamic = ["version", "dependencies"]
description = "AUTO-MAS core system plugin and developer SDK"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
# 市场多语言声明位于 README 开头；Keywords 仅保留普通关键词与门禁。
keywords = [
  "auto-mas-plugin",
  "auto-mas-id:auto_mas_core",
]

[project.urls]
Documentation = "https://doc.auto-mas.top/developer/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_mas_core = ["py.typed", "i18n/*.json"]

[tool.setuptools.dynamic]
version = {attr = "auto_mas_core._version.__version__"}
dependencies = {file = "host-dependencies.txt"}
