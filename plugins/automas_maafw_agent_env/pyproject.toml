[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automas-maafw-agent-env"
version = "0.1.0"
description = "MaaFW agent command plan and environment preparation plugin for AUTO-MAS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "automas-maafw-interface>=0.1.0",
    "pydantic>=2",
]

[project.entry-points."auto_mas.plugins"]
automas_maafw_agent_env = "automas_maafw_agent_env.plugin:Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automas_maafw_agent_env = ["py.typed"]
