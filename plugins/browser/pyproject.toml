[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automas-plugin-browser"
version = "0.1.0"
description = "Persistent Chromium browser runtime plugin for AUTO-MAS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
    "auto-mas-core>=6.0.0a1",
    "psutil>=7.0,<8",
    "pydantic>=2.11,<3",
    "selenium>=4.44,<5",
]

[project.entry-points."auto_mas.plugins"]
browser = "automas_plugin_browser.plugin:Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automas_plugin_browser = ["py.typed"]
