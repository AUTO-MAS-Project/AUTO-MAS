[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automas_plugin_ok_script_adapter"
version = "0.1.0"
description = "Generic ok-script adapter for AUTO-MAS"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = []

[project.entry-points."auto_mas.plugins"]
ok_script_adapter = "ok_script_adapter.plugin:Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ok_script_adapter = ["frontend/*.json", "frontend/*.js", "frontend/*.css"]
