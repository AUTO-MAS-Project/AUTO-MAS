[project]
name = "auto-mas"
version = "5.2.0"
description = "A Multi-Script, Multi-Config Management and Automation Software"
requires-python = "~=3.12.0"
license = "AGPL-3.0-or-later"
dependencies = [
    "loguru==0.7.3",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
    "websockets==15.0.1",
    "aiofiles==24.1.0",
    "aiohttp==3.13.3",
    "httpx[socks]==0.28.1",
    "gitpython==3.1.45",
    "plyer==2.1.0",
    "psutil==7.0.0",
    "jinja2==3.1.6",
    "pywin32==310",
    "keyboard==0.13.5",
    "pycryptodome==3.23.0",
    "truststore==0.10.1",
    "pillow==12.1.1",
    "packaging==25.0",
    "rapidocr_onnxruntime==1.2.3",
    "pygetwindow==0.0.9",
    "pyautogui==0.9.54",
    "pynput==1.8.1",
    "numpy==2.3.4",
    "opencv-python==4.10.0.84",
    "maafw==5.8.1",
    "mss==9.0.2",
    "fastapi-mcp==0.4.0",
    "json5==0.14.0",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "auto-mas-core",
]
plugins = [
    "auto-mas-core",
    "automas_background",
    "automas_notification",
    "automas_notification_koishi",
    "automas_notification_mail",
    "automas_notification_onebot",
    "automas_notification_serverchan",
    "automas_notification_system",
    "automas_notification_test",
    "automas_notification_webhook",
    "automas_plugin_ces",
    "automas_plugin_emulator",
    "automas_plugin_kill_process",
    "automas_plugin_mirrorc",
    "automas_plugin_page",
    "automas_plugin_schema_showcase",
    "automas_script_maa",
    "automas_script_src",
    "automas_scritp_src",
    "automas_test",
]

[tool.auto-mas.plugin-bootstrap]
# 支持两种写法：
# 1) 仅声明包名： "automas_script_maa"
# 2) 声明固定版本： { name = "automas_script_maa", version = "0.0.5-alpha" }
# 3) 声明任意版本约束： { name = "automas_script_maa", specifier = ">=0.0.5-alpha,<0.1.0" }
packages = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "plugins/auto_mas_core",
    "plugins/background",
    "plugins/ces",
    "plugins/emulator",
    "plugins/kill_process",
    "plugins/mirrorc",
    "plugins/notification",
    "plugins/notification_koishi",
    "plugins/notification_mail",
    "plugins/notification_onebot",
    "plugins/notification_serverchan",
    "plugins/notification_system",
    "plugins/notification_test",
    "plugins/notification_webhook",
    "plugins/page",
    "plugins/schema_showcase",
    "plugins/script_maa",
    "plugins/script_src",
    "plugins/scritp_src",
    "plugins/test",
]
exclude = [
    "plugins/pypi",
    "plugins/_generated",
]

[tool.uv.sources]
"auto-mas-core" = { workspace = true }
"automas_background" = { workspace = true }
"automas_notification" = { workspace = true }
"automas_notification_koishi" = { workspace = true }
"automas_notification_mail" = { workspace = true }
"automas_notification_onebot" = { workspace = true }
"automas_notification_serverchan" = { workspace = true }
"automas_notification_system" = { workspace = true }
"automas_notification_test" = { workspace = true }
"automas_notification_webhook" = { workspace = true }
"automas_plugin_ces" = { workspace = true }
"automas_plugin_emulator" = { workspace = true }
"automas_plugin_kill_process" = { workspace = true }
"automas_plugin_mirrorc" = { workspace = true }
"automas_plugin_page" = { workspace = true }
"automas_plugin_schema_showcase" = { workspace = true }
"automas_script_maa" = { workspace = true }
"automas_script_src" = { workspace = true }
"automas_scritp_src" = { workspace = true }
"automas_test" = { workspace = true }
