[project]
name = "auto-mas"
version = "5.2.0"
description = "A Multi-Script, Multi-Config Management and Automation Software"
requires-python = "~=3.12.0"
license = "AGPL-3.0-or-later"
dependencies = [
    "loguru==0.7.3",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
    "websockets==15.0.1",
    "aiofiles==24.1.0",
    "aiohttp==3.13.3",
    "httpx[socks]==0.28.1",
    "gitpython==3.1.45",
    "plyer==2.1.0",
    "psutil==7.0.0",
    "jinja2==3.1.6",
    "pywin32==310",
    "keyboard==0.13.5",
    "pycryptodome==3.23.0",
    "truststore==0.10.1",
    "pillow==12.1.1",
    "packaging==25.0",
    "rapidocr_onnxruntime==1.2.3",
    "pygetwindow==0.0.9",
    "pyautogui==0.9.54",
    "pynput==1.8.1",
    "numpy==2.3.4",
    "opencv-python==4.10.0.84",
    "maafw==5.8.1",
    "mss==9.0.2",
    "fastapi-mcp==0.4.0",
    "json5==0.14.0",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "auto-mas-core",
]
plugins = [
    "auto-mas-core",
    "automas_plugin_ok_script_adapter",
    "automas_plugin_okww_adapter",
]

[tool.auto-mas.plugin-bootstrap]
# 支持两种写法：
# 1) 仅声明包名： "automas_script_maa"
# 2) 声明固定版本： { name = "automas_script_maa", version = "0.0.5-alpha" }
# 3) 声明任意版本约束： { name = "automas_script_maa", specifier = ">=0.0.5-alpha,<0.1.0" }
packages = [
    "automas_plugin_ok_script_adapter",
    "automas_plugin_okww_adapter",
    { name = "automas-maafw-interface", version = "0.2.0" },
    { name = "automas-maafw-agent-env", version = "0.1.4" },
    { name = "automas-maafw-controller-adb", version = "0.1.1" },
    { name = "automas-maafw-controller-win32", version = "0.1.2" },
    { name = "automas-maafw-project-update", version = "0.2.3" },
    { name = "automas-maafw-runtime-pool", version = "0.2.0" },
    { name = "automas-maafw-runner", version = "0.4.0" },
    { name = "automas-script-maafw", version = "0.1.12" },
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.uv.workspace]
members = [
    "plugins/auto_mas_core",
    "plugins/ok_script_adapter",
    "plugins/okww_adapter",
]
exclude = [
    "plugins/pypi",
    "plugins/_generated",
]

[tool.uv.sources]
"auto-mas-core" = { workspace = true }
"automas_plugin_ok_script_adapter" = { workspace = true }
"automas_plugin_okww_adapter" = { workspace = true }
