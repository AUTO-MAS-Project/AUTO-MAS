[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "frontend",
    "res",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

ignore = ["E501"]

[tool.ruff.lint.isort]
# 将项目内部模块与第三方依赖正确分组。
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
